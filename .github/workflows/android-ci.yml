name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Verify debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Format, test, lint, and build
        run: ./gradlew spotlessCheck test lint assembleDebug --stacktrace

      # Also fails on a newly exported schema version that was never committed.
      - name: Verify committed Room schema
        run: |
          git status --porcelain -- app/schemas
          test -z "$(git status --porcelain -- app/schemas)"

  data-instrumented:
    name: Room migrations, transactions, and restore on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Build app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Room migrations, DAO/repository transactions, backup/restore, and the import and calendar stores.
      # API 33 is minSdk, so the oldest supported SQLite runs every migration.
      - name: Run data instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: >-
            ./gradlew connectedDebugAndroidTest --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.package=com.cydoniancitizen.bingee.data.library,com.cydoniancitizen.bingee.data.importexport,com.cydoniancitizen.bingee.data.calendar,com.cydoniancitizen.bingee.data.imports,com.cydoniancitizen.bingee.data.rating,com.cydoniancitizen.bingee.data.settings

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: data-instrumented-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14

  ui-instrumented:
    name: Offline startup and core UI flows on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI smoke tests without network
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: |
            adb shell cmd connectivity airplane-mode enable
            adb shell svc wifi disable
            adb shell svc data disable
            ./gradlew connectedDebugAndroidTest --stacktrace \
              '-Pandroid.testInstrumentationRunnerArguments.class=com.cydoniancitizen.bingee.OfflineLaunchTest#firstLaunchContinuesOfflineToHome,com.cydoniancitizen.bingee.feature.home.HomeScreenTest#emptyLoadingAndLastUpdateStatesAreVisible,com.cydoniancitizen.bingee.feature.search.SearchScreenTest#queryInputClearAndCategoryActionsAreExplicit,com.cydoniancitizen.bingee.feature.search.SearchScreenTest#rowOpensDetailsButLibraryActionDoesNotNavigate,com.cydoniancitizen.bingee.feature.details.MediaDetailsScreenTest#movieDetailsRenderWatchedActionAndTitleRatingControls,com.cydoniancitizen.bingee.feature.details.MediaDetailsScreenTest#staleRefreshErrorAndRefreshIndicatorKeepCachedContentVisible,com.cydoniancitizen.bingee.feature.settings.DataBackupSettingsScreenTest#backupActionsAndTvTimeImportAreReachable,com.cydoniancitizen.bingee.feature.settings.BackupViewModelTest#validationRunsOnItsOwnDispatcherAndNothingIsWrittenBeforeConfirmation,com.cydoniancitizen.bingee.NotificationActivityNavigationTest#coldStartNavigatesOnceAndBackReturnsToHome'

      - name: Upload UI test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-instrumented-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14
